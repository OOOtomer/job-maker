}
@media (prefers-color-scheme: dark){
  :root{

}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text-primary);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;line-height:1.6}
.wrap{max-width:480px;margin:0 auto;padding:16px}
.card{background:var(--surface-2);border:0.5px solid var(--border);border-radius:14px;padding:18px 18px 20px}
button{font-family:inherit;touch-action:manipulation;cursor:pointer}
.op{display:block;width:100%;min-height:48px;text-align:left;padding:12px 14px;margin:10px 0;font-size:15px;line-height:1.5;color:var(--text-primary);background:var(--surface-2);border:1px solid var(--border);border-radius:10px;-webkit-tap-highlight-color:transparent}
.op:active{background:var(--surface-1)}
.primary{display:block;width:100%;padding:13px;margin-top:16px;font-size:16px;font-weight:600;color:var(--accent-text);background:var(--accent);border:none;border-radius:10px}
.primary:active{opacity:.85}
.ghost{background:none;border:none;color:var(--text-secondary);font-size:13px;padding:8px 0;margin-top:4px;text-decoration:underline}
input[type=text]{width:100%;font-size:16px;padding:11px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);color:var(--text-primary);font-family:inherit}
.bar{height:8px;background:var(--surface-1);border-radius:4px;overflow:hidden}
.sec{font-size:13px;font-weight:600;color:var(--text-secondary);margin:22px 0 8px;display:flex;align-items:center;gap:6px}
.sec::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--accent);transform:rotate(45deg)}
.row{display:grid;grid-template-columns:64px minmax(0,1fr) 28px;align-items:center;gap:8px;font-size:13px}
.item{padding:10px 0;border-top:0.5px solid var(--border)}
.nm{font-size:14px;font-weight:600;margin:0 0 2px}
.ds{font-size:13px;color:var(--text-secondary);margin:0;line-height:1.65}
.cell{background:var(--surface-1);border-radius:var(--radius);padding:10px 12px}
.tg{font-size:11px;padding:1px 6px;border-radius:6px;margin-left:6px;font-weight:400}
.note{font-size:11px;color:var(--text-muted);margin:12px 0 0;line-height:1.6}
</style>
</head>

const SP={H:[['真実の言葉','呪文',3,'嘘やごまかしを見抜き、話し合いを正しい方向へ戻す。'],['交渉術','特技',0,'相手の欲しいものを見抜き、有利な条件を引き出す。']],E:[['共感の祈り','呪文',4,'仲間の心の痛みを感じ取り、気持ちを回復させる。'],['不動の構え','特技',0,'脅しや混乱を受けても、判断が一切ぶれない。']],X:[['鼓舞の雄叫び','特技',2,'仲間全員のやる気を引き上げる。'],['静寂の時間','特技',0,'一人の時間を取ることで、MPを大きく回復する。']],A:[['和解の光','呪文',6,'対立をおさめ、仲間同士の関係を修復する。'],['直言の一撃','特技',3,'誰も言えなかった問題点を指摘し、議論の流れを変える。']],C:[['周到な準備','呪文',5,'事前の段取りで、戦闘中の全員のみのまもりを上げる。'],['臨機応変','特技',2,'予想外の事態でも、その場で最善の行動を選ぶ。']],O:[['閃きの呪文','呪文',8,'誰も思いつかなかった解決策を生み出す。'],['定石','特技',1,'実績のある方法で、確実に成果を出す。']]};
const SPX=[
['構想具現','呪文',15,'頭の中にある設計を、そのまま現実の形にする。',s=>s.O>=65&&s.C>=65],
['宴の大回復','呪文',12,'人が集まる場を作り、仲間全員の心を回復させる。',s=>s.X>=62&&s.A>=62],
['誓約の盾','呪文',10,'交わした約束を必ず守り、仲間の信頼を一度も失わない。',s=>s.H>=65&&s.C>=62],
['心の聴診','呪文',7,'相手が口にしない本音を、言葉になる前に感じ取る。',s=>s.E>=62&&s.X<=40],
['単騎突破','特技',6,'周りの反対を気にせず、一人で状況を打開する。',s=>s.A<=38&&s.E<=40],
['気まぐれの奇跡','呪文','?','何が起きるか本人にも分からないが、なぜか場がうまく収まる。',s=>s.C<=35&&s.X>=60]
];
const INS={H:['損をしても筋を通す人です。ずるさを嫌い、自分を大きく見せることに興味がありません。','自分の利益を冷静に計算できる人です。人を動かす方法をよく分かっています。'],E:['感情の振れ幅が大きく、人の気持ちに敏感です。不安を感じやすいぶん、危険に気づくのも早い人です。','多少のことでは動じません。危機の場面で落ち着いていられる一方、人からは淡白に見られることがあります。'],X:['人と関わることで元気になる人です。自分の意見を人前で言うことを苦にしません。','一人の時間で回復する人です。大勢の中より、少人数や一対一で力を発揮します。'],A:['人の失敗を許し、衝突を避けて穏やかに収める人です。','納得できないことには率直に異を唱えます。妥協しないぶん、議論から逃げない人です。'],C:['計画を立て、手を抜かずにやり遂げる人です。周りからの信頼はこの几帳面さから生まれています。','その場の判断で柔軟に動く人です。細かい段取りより、勢いと臨機応変さが持ち味です。'],O:['新しい考えや美しいものに強く惹かれます。常識を疑い、自分なりの見方を作る人です。','実績のある方法と現実的な判断を大事にする人です。流行や抽象論に振り回されず、判断がぶれません。']};
const CT={H:'正直でいたい場面と、実利を取る場面がはっきり分かれている。',E:'動じない時と、強く不安を感じる時の差が大きい。',X:'人の中にいたい時と、一人になりたい時が交互に来る。',A:'人に優しくしたい気持ちと、言うべきことは言いたい気持ちの両方を持っている。',C:'きちんとしたい分野と、まったく気にしない分野がはっきりしている。',O:'新しいものに惹かれる一方で、慣れたものへの安心も手放さない。'};
const TR=[
['調和の人',5,'どの性質にも極端な偏りがなく、場面に応じて振る舞いを変えられる。',s=>AX.every(a=>s[a]>=38&&s[a]<=62)],
['信頼の柱',4,'約束を守り、見えない所でも手を抜かない。周りから最も頼られる。',s=>s.H>=65&&s.C>=65],
['人望の人',4,'人が自然に集まり、その場が和やかになる。',s=>s.X>=65&&s.A>=65],
['静かな探究者',4,'一人で深く考え、自分だけの見方を持っている。',s=>s.X<=38&&s.O>=65],
['交渉上手',4,'人の動かし方をよく分かっていて、自分に有利な状況を作れる。',s=>s.H<=38&&s.X>=60],
['内に秘めた感受性',4,'表には出さないが、心の中では多くのことを感じている。',s=>s.E>=65&&s.X<=38],
['妥協なき仕事人',4,'自分にも他人にも求める水準が高く、指摘も率直。',s=>s.C>=65&&s.A<=40],
['議論の火付け役',3,'物怖じせずに意見をぶつけ、話を前に進める。',s=>s.X>=65&&s.A<=38],
['共感の人',3,'人のつらさに敏感で、放っておけない。',s=>s.E>=65&&s.A>=60],
['冷静な判断者',3,'情に流されず、必要なら厳しい判断も下せる。',s=>s.E<=38&&s.A<=42],
['心配性の完璧主義',3,'失敗を恐れるぶん、準備は誰よりも周到。',s=>s.C>=65&&s.E>=62],
['その場の主役',3,'計画より勢いで動き、場を盛り上げる。',s=>s.C<=38&&s.X>=62],
['控えめな正直者',3,'目立たないが、裏表がまったくない。',s=>s.H>=65&&s.X<=40],
['伝統の守り手',3,'実績のある方法を、確実に積み重ねる。',s=>s.O<=38&&s.C>=60],
['怖いもの知らず',3,'人前でも危機の場面でも動じない。',s=>s.E<=35&&s.X>=60],
['自由人',3,'決まりや予定に縛られず、気の向く方へ進む。',s=>s.C<=35&&s.O>=60]
];
const app=document.getElementById('app');
const START=app.innerHTML;
let st={};
const esc=t=>t.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuf(a){for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]];}return a;}
function toTop(){window.scrollTo(0,0);}
function bindStart(){document.getElementById('go').onclick=start;}
function start(){
const v=document.getElementById('nm').value.trim();
st={i:0,ans:new Array(Q.length).fill(-1),tm:new Array(Q.length).fill(0),ord:Q.map(q=>shuf(q[2].map((_,k)=>k))),name:v||'名もなき旅人',t0:0};
showQ();
}
function showQ(){
const q=Q[st.i],n=Q.length,pc=Math.round(st.i/n*100);
let h='<div class="card"><div style="display:flex;justify-content:space-between;font-size:13px;color:var(--text-secondary);"><span>第'+(st.i+1)+'の問い / '+n+'</span><span>'+pc+'%</span></div><div class="bar" style="margin:6px 0 16px;"><div style="width:'+pc+'%;height:100%;background:var(--accent);"></div></div><p style="font-size:17px;line-height:1.7;margin:0 0 6px;">'+q[0]+'</p>';
st.ord[st.i].forEach(k=>{h+='<button class="op" data-k="'+k+'">'+q[2][k][0]+'</button>';});
if(st.i>0)h+='<button id="bk" class="ghost">前の問いに戻る</button>';
h+='</div>';
app.innerHTML=h;
app.querySelectorAll('.op').forEach(b=>{b.onclick=()=>pick(+b.dataset.k);});
const bk=document.getElementById('bk');if(bk)bk.onclick=back;
toTop();
st.t0=performance.now();
}
function pick(k){st.tm[st.i]+=performance.now()-st.t0;st.ans[st.i]=k;st.i++;if(st.i>=Q.length)result();else showQ();}
function back(){st.tm[st.i]+=performance.now()-st.t0;st.i--;showQ();}
function result(){
const sum={},ex={},va={},pos={},neg={};
AX.forEach(a=>{sum[a]=0;ex[a]=0;va[a]=0;pos[a]=0;neg[a]=0;});
Q.forEach((q,qi)=>{AX.forEach(a=>{
const ws=q[2].map(o=>o[1][a]||0),m=ws.reduce((x,y)=>x+y,0)/ws.length;
ex[a]+=m;va[a]+=ws.reduce((x,y)=>x+(y-m)*(y-m),0)/ws.length;
const w=q[2][st.ans[qi]][1][a]||0;sum[a]+=w;if(w>0)pos[a]+=w;if(w<0)neg[a]-=w;});});
const s={};
AX.forEach(a=>{const z=va[a]>0?(sum[a]-ex[a])/Math.sqrt(va[a]):0;s[a]=Math.max(2,Math.min(99,Math.round(50+16*z)));});
const rk=AX.slice().sort((x,y)=>Math.abs(s[y]-50)-Math.abs(s[x]-50));
const p=a=>s[a]>=50?0:1;
const jb=JOBS.map(j=>{const d=Math.sqrt(AX.reduce((t,a)=>t+(s[a]-j[1][a])**2,0));return {n:j[0],d:j[2],m:Math.max(1,Math.min(99,Math.round(100-d*0.9)))};}).sort((x,y)=>y.m-x.m);
const job=jb[0];
const ttl=AJ[rk[0]][p(rk[0])];
const md=AX.reduce((t,a)=>t+Math.abs(s[a]-50),0)/AX.length;
const lv=Math.max(1,Math.min(99,Math.round(md*2.4+15)));
const sv=STATS.map(x=>Math.round(x[1](s)));
const phys=sv[0]>=sv[1];
const dq=(phys?DQS:DQM)[rk[0]][p(rk[0])];
let sp=[{n:dq[0],t:phys?'特技':'呪文',c:null,d:dq[1],tag:'本家'}];
SPX.filter(x=>x[4](s)).slice(0,2).forEach(x=>sp.push({n:x[0],t:x[1],c:x[2],d:x[3],tag:'固有'}));
for(const a of rk.slice(1)){if(sp.length>=4)break;const x=SP[a][p(a)];sp.push({n:x[0],t:x[1],c:x[2],d:x[3],tag:''});}
let tr=TR.filter(t=>t[3](s)).slice(0,2).map(t=>({n:t[0],r:t[1],d:t[2]}));
const ca=AX.filter(a=>pos[a]>=2&&neg[a]>=2).sort((x,y)=>Math.min(pos[y],neg[y])-Math.min(pos[x],neg[x]));
if(ca.length)tr.push({n:'揺らぎ：'+LB[ca[0]],r:3,d:CT[ca[0]]});
const tms=st.tm.slice().sort((x,y)=>x-y),med=tms[Math.floor(tms.length/2)];
let hi=0;st.tm.forEach((t,k)=>{if(t>st.tm[hi])hi=k;});
const hes=(st.tm[hi]>=1.6*med&&st.tm[hi]>5000)?hi:-1;
let ins=INS[rk[0]][p(rk[0])]+INS[rk[1]][p(rk[1])];
if(ca.length)ins+='ただ、'+CT[ca[0]];
let h='<div class="card"><div style="display:flex;align-items:center;gap:12px;"><div style="width:52px;height:52px;border-radius:50%;background:#EEEDFE;color:#3C3489;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:17px;flex-shrink:0;">'+esc(st.name.slice(0,1))+'</div><div style="flex:1;min-width:0;"><p style="font-size:18px;font-weight:600;margin:0;">'+esc(st.name)+'</p><p style="font-size:13px;color:var(--text-secondary);margin:0;">'+ttl+job.n+'</p></div><div style="text-align:right;"><p style="font-size:11px;color:var(--text-muted);margin:0;">Lv.</p><p style="font-size:26px;font-weight:600;margin:0;line-height:1;">'+lv+'</p></div></div>';
h+='<div class="cell" style="margin-top:14px;"><p style="font-size:13px;margin:0 0 2px;"><span style="font-weight:600;">職業：'+job.n+'</span><span style="color:var(--text-muted);margin-left:8px;">適性 '+job.m+'%</span></p><p class="ds">'+job.d+'</p></div>';
h+='<p class="ds" style="margin-top:14px;color:var(--text-primary);">'+ins+'</p>';
h+='<div class="sec">ステータス</div><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;">';
STATS.forEach((x,k)=>{const v=sv[k];h+='<div class="cell"><div style="display:flex;justify-content:space-between;font-size:13px;"><span>'+x[0]+'</span><span style="font-weight:600;">'+v+'</span></div><div class="bar" style="margin:6px 0 0;background:var(--surface-2);"><div style="width:'+Math.min(100,v/x[2]*100)+'%;height:100%;background:var(--accent);"></div></div></div>';});
h+='</div>';
h+='<div class="sec">呪文・特技</div>';
sp.forEach(x=>{let tg='';if(x.tag==='本家')tg='<span class="tg" style="background:#FAEEDA;color:#633806;">本家</span>';if(x.tag==='固有')tg='<span class="tg" style="background:#EEEDFE;color:#3C3489;">固有</span>';const cost=x.c===null?'':('　'+(x.c===0?'消費なし':'MP '+x.c));h+='<div class="item"><p class="nm">'+x.n+'<span style="font-size:12px;color:var(--text-muted);font-weight:400;margin-left:8px;">'+x.t+cost+'</span>'+tg+'</p><p class="ds">'+x.d+'</p></div>';});
h+='<div class="sec">性格パラメータ</div>';
AX.forEach(a=>{const b=s[a]<38?0:(s[a]>62?2:1);h+='<div style="margin:0 0 12px;"><div class="row"><span>'+LB[a]+'</span><div class="bar"><div style="width:'+s[a]+'%;height:100%;background:'+COL[a]+';"></div></div><span style="text-align:right;font-weight:600;">'+s[a]+'</span></div><p class="ds" style="font-size:12px;margin:3px 0 0 72px;">'+BAND[a][b]+'</p></div>';});
if(tr.length){h+='<div class="sec">特性</div>';tr.forEach(t=>{h+='<div class="item"><p class="nm">'+t.n+'<span style="font-size:12px;color:#BA7517;margin-left:8px;font-weight:400;">'+'★'.repeat(t.r)+'☆'.repeat(5-t.r)+'</span></p><p class="ds">'+t.d+'</p></div>';});}
h+='<div class="sec">迷いの在り処</div>';
if(hes>=0)h+='<div class="item"><p class="nm">第'+(hes+1)+'の問い　'+Math.round(st.tm[hes]/1000)+'秒</p><p class="ds" style="margin-bottom:6px;">'+Q[hes][0]+'</p><p class="ds" style="color:var(--text-primary);">'+Q[hes][1]+'</p></div>';
else h+='<div class="item"><p class="ds" style="color:var(--text-primary);">大きく迷った問いはありませんでした。判断の基準が、自分の中ではっきりしている人です。</p></div>';
h+='<div class="sec">転職候補</div>';
jb.slice(1,3).forEach(j=>{h+='<div class="item" style="display:flex;justify-content:space-between;gap:8px;"><span style="font-size:14px;">'+j.n+'</span><span style="font-size:13px;color:var(--text-muted);">適性 '+j.m+'%</span></div>';});
h+='<button id="rs" class="primary">次の旅人を迎える</button>';
h+='<p class="note">性格パラメータは心理学のHEXACOモデルを土台にしています。問いは独自に作ったもので、検証された心理検査ではありません。</p></div>';
app.innerHTML=h;
toTop();
document.getElementById('rs').onclick=()=>{app.innerHTML=START;bindStart();toTop();};
}
bindStart();
</script>
