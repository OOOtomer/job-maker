<html lang="ja">

<meta charset="UTF-8">

<title>ポケモン診断</title>
<style>
:root{
  --bg:#f3f5f4;--surface-1:#e9ecea;--surface-2:#ffffff;--border:rgba(0,0,0,0.12);
  --text-primary:#26292a;--text-secondary:#5a5f60;--text-muted:#878c8d;
  --accent:#D9413A;--accent-text:#ffffff;--sub:#3B6FD4;--radius:8px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#181a1b;--surface-1:#2a2d2e;--surface-2:#212425;--border:rgba(255,255,255,0.14);
    --text-primary:#eceeee;--text-secondary:#b2b7b8;--text-muted:#858a8b;
    --accent:#E8574F;--accent-text:#ffffff;--sub:#6E98EA;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text-primary);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;line-height:1.6}
.wrap{max-width:480px;margin:0 auto;padding:16px}
.card{background:var(--surface-2);border:0.5px solid var(--border);border-radius:14px;padding:18px 18px 20px;margin-bottom:12px}
button{font-family:inherit;touch-action:manipulation;cursor:pointer}
.op{display:block;width:100%;min-height:48px;text-align:left;padding:12px 14px;margin:10px 0;font-size:15px;line-height:1.5;color:var(--text-primary);background:var(--surface-2);border:1px solid var(--border);border-radius:10px;-webkit-tap-highlight-color:transparent}
.op:active{background:var(--surface-1)}
.primary{display:block;width:100%;padding:13px;margin-top:16px;font-size:16px;font-weight:600;color:var(--accent-text);background:var(--accent);border:none;border-radius:10px}
.primary:active{opacity:.85}
.ghost{background:none;border:none;color:var(--text-secondary);font-size:13px;padding:8px 0;margin-top:4px;text-decoration:underline}
input[type=text]{width:100%;font-size:16px;padding:11px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);color:var(--text-primary);font-family:inherit}
.bar{height:8px;background:var(--surface-1);border-radius:4px;overflow:hidden}
.bar>div{height:100%}
.thin{height:6px}
.sec{font-size:13px;font-weight:600;color:var(--text-secondary);margin:22px 0 8px;display:flex;align-items:center;gap:8px}
.sec::before{content:"";width:10px;height:10px;border-radius:50%;background:linear-gradient(var(--accent) 0 45%,var(--text-primary) 45% 55%,var(--surface-2) 55%);border:1px solid var(--text-primary)}
.sec.first{margin-top:0}
.row{display:grid;grid-template-columns:64px minmax(0,1fr) 28px;align-items:center;gap:8px;font-size:13px}
.cmp{display:grid;grid-template-columns:62px minmax(0,1fr) 66px;align-items:center;gap:8px;font-size:13px;margin:8px 0}
.b2{display:flex;flex-direction:column;gap:3px}
.num{text-align:right;font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
.item{padding:10px 0;border-top:0.5px solid var(--border)}
.nm{font-size:14px;font-weight:600;margin:0 0 2px}
.ds{font-size:13px;color:var(--text-secondary);margin:0;line-height:1.65}
.cell{background:var(--surface-1);border-radius:var(--radius);padding:10px 12px}
.type{display:inline-block;font-size:11px;padding:1px 8px;border-radius:6px;margin:0 4px 0 0;font-weight:600;line-height:1.7}
.pk{font-size:22px;font-weight:700;margin:2px 0 4px}
.no{font-size:12px;color:var(--text-muted);margin:0}
.lg{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12px;color:var(--text-secondary);margin:10px 0 2px}
.lg span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.note{font-size:11px;color:var(--text-muted);margin:12px 0 0;line-height:1.6}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--surface-1);color:var(--text-secondary)}
</style>
</head>
<body>
<div class="wrap" id="app">
<div class="card">
<p style="font-size:21px;font-weight:700;margin:0 0 8px;">ポケモン診断</p>
<p class="ds">25の問いに答えると、あなたの性格から「種族値」と「性格」の2つの面で、あなたに近いポケモンを見つけます。種族値は人気のポケモン134匹と、全1025匹の両方で照合します。6〜8分ほどです。</p>
<div class="cell" style="margin-top:12px;"><p class="ds" style="color:var(--text-primary);">ゲームの攻略としての正解ではなく、もしあなたが本当にポケモンの世界にいたらどうするかで、直感で選んでください。迷った時間も結果に反映されます。</p></div>
<label for="nm" style="display:block;font-size:13px;color:var(--text-secondary);margin:16px 0 6px;">トレーナー名（任意）</label>
<input id="nm" type="text" placeholder="たろう" autocomplete="off">
<button id="go" class="primary">冒険に出る</button>
<p class="note">回答は、このスマホの中だけで計算されます。どこにも送信・保存されません。</p>
</div>

const PAIR={"HE":["正直で人の痛みにも敏感なので、誰かが不公平な目にあうと、自分のことのように心を痛めます。","正しいと思ったことは、周りの圧力があっても動じずに貫けます。","損得に敏感なのは、傷つくことを避けたい慎重さの表れでもあります。","冷静に損得を計算でき、勝負どころで迷わず有利な手を打てます。"],"HX":["人前でも裏表がないので、初対面の相手からもすぐに信頼されます。","口数は多くありませんが、言ったことは必ず守る人として信頼されています。","人を乗せるのが上手で、交渉や駆け引きの場で力を発揮します。","手の内を明かさず、静かに状況を見極めてから動きます。"],"HA":["誠実で寛容なので、周りから相談相手として頼られることが多いはずです。","正しくないことには、相手が誰でもはっきり「違う」と言えます。","人当たりは柔らかいですが、自分に有利な落としどころを見つけるのが上手です。","自分の利益を守るためなら、衝突することもいといません。"],"HC":["ルールと約束を大切にし、誰も見ていない所でも手を抜きません。","細かい決まりにはこだわりませんが、人をだますようなことは決してしません。","目的のために計画を立て、抜け目なく準備を進められます。","その場の流れを読み、チャンスがあれば素早くつかみにいきます。"],"HO":["自分を飾らずに、新しい考えを素直に受け入れられます。","昔からの約束事や、筋の通ったやり方を変わらずに守ります。","発想が柔軟で、ルールの抜け道や新しい攻め方を見つけるのが得意です。","実績のある手堅いやり方で、着実に得を積み上げます。"],"EX":["感情表現が豊かで、喜びも不安も周りと分かち合いながら進みます。","心の中では多くのことを感じていますが、それを表に出すのは親しい相手にだけです。","人前でも緊張せず、場の中心に立つことを楽しめます。","一人でも平然と過ごせて、周りの騒がしさに振り回されません。"],"EA":["人の気持ちに寄り添い、困っている人を放っておけません。","感受性が強いぶん、納得できないことには気持ちを込めて反論します。","何が起きても落ち着いていて、周りを安心させる存在です。","情に流されず、必要なら厳しいことも冷静に言えます。"],"EC":["心配性なぶん準備が周到で、失敗の芽を早めに摘み取ります。","気持ちの波に合わせて動くので、調子の良い時には驚くほどの力を出します。","冷静に計画を立て、プレッシャーの中でも手順どおりにやり遂げます。","先のことをあまり心配せず、その場の判断で身軽に動きます。"],"EO":["美しいものや物語に心を動かされやすく、豊かな感性を持っています。","慣れた場所や人のそばで、安心して力を発揮するタイプです。","未知のものを怖がらず、新しいことに迷わず飛び込めます。","地に足がついていて、どんな状況でも現実的な判断がぶれません。"],"XA":["明るく人当たりが良いので、自然と周りに人が集まります。","自分の意見をはっきり言い、議論を引っ張っていきます。","控えめで穏やかなので、一緒にいる人に安心感を与えます。","口数は少ないですが、譲れないことは静かに、しかしはっきりと主張します。"],"XC":["人を巻き込みながら、計画どおりに物事を進めるまとめ役です。","勢いと人懐っこさで、その場を一気に盛り上げます。","一人でこつこつと積み重ね、確かな成果を出します。","自分のペースを大切にし、気の向いたことに自由に打ち込みます。"],"XO":["新しい人や場所との出会いを、心から楽しめます。","気心の知れた仲間と、慣れた場所で過ごす時間を大切にします。","一人で考えを深め、人とは違う独自の見方を育てています。","静かで堅実な毎日を好み、身の回りのことを大切にします。"],"AC":["穏やかで責任感が強く、任されたことを最後まで丁寧にやり遂げます。","細かいことを気にせず、おおらかに構えていられます。","自分にも他人にも高い水準を求め、妥協を許しません。","思ったことをすぐ口にし、決まりより自分の感覚を優先します。"],"AO":["違う考えの人も受け入れ、新しい意見を柔軟に取り入れられます。","争いを好まず、慣れ親しんだやり方を穏やかに守ります。","常識を疑い、納得できるまで自分の考えを突き詰めます。","実績のある方法を信じ、根拠のない新しい案にははっきり反対します。"],"CO":["新しい発想を、計画的に形にしていく力があります。","確かな手順を守り、毎回安定した結果を出します。","思いつきを大切にし、決まった型にはまらずに動きます。","細かい計画より、慣れたやり方でその場をうまく乗り切るのが得意です。"]};
const CTP={"H":"建前と本音を、場面によって使い分けています。","E":"平気な時と、ひどく弱気な時の差が大きいようです。","X":"人といたい日と、こもりたい日の差が大きいようです。","A":"人に任せる場面と、一歩も譲らない場面の差が大きいようです。","C":"徹底する分野と、まったく構わない分野の差が大きいようです。","O":"珍しいものを追いかける時と、いつもの定番に戻る時があるようです。"};
const BAL="どの性格にも極端な偏りがない、バランスの取れた人です。あえて特徴を挙げるなら、";
const byName={};P.forEach(p=>{byName[p[1]]=p;});
const mat=(v,M)=>M[0].map((_,j)=>v.reduce((t,x,i)=>t+x*M[i][j],0));
function rankDist(z,set){const r=set.z.map((y,k)=>{let d=0;for(let i=0;i<6;i++){const e=z[i]-y[i];d+=e*e;}return {k:k,d:Math.sqrt(d),sc:d-set.w[k]};});r.sort((a,b)=>a.sc-b.sc);return r;}
function compute(ans){
  const sum={},ex={},va={},pos={},neg={};
  AX.forEach(a=>{sum[a]=0;ex[a]=0;va[a]=0;pos[a]=0;neg[a]=0;});
  Q.forEach((q,qi)=>{AX.forEach(a=>{
    const ws=q[2].map(o=>o[1][a]||0),m=ws.reduce((x,y)=>x+y,0)/ws.length;
    ex[a]+=m;va[a]+=ws.reduce((x,y)=>x+(y-m)*(y-m),0)/ws.length;
    const w=q[2][ans[qi]][1][a]||0;sum[a]+=w;if(w>0)pos[a]+=w;if(w<0)neg[a]-=w;});});
  const s={};
  AX.forEach(a=>{const z=va[a]>0?(sum[a]-ex[a])/Math.sqrt(va[a]):0;s[a]=Math.max(2,Math.min(99,Math.round(50+16*z)));});
  const sv=AX.map(a=>s[a]);
  const tv=sv.map(x=>(x-50)/16), g=K.MM.map(row=>row.reduce((t,c,i)=>t+c*tv[i],0)), gm=g.reduce((x,y)=>x+y,0)/6, gc=g.map(x=>x-gm);
  const zu=gc.map(x=>x*K.CU);
  let hsh=0;for(let q=0;q<ans.length;q++)hsh=(hsh*31+ans[q]+1)%1000003;
  const expand=(S,ranked,n)=>{const out=[];for(let j=0;j<ranked.length&&out.length<n;j++){const m=S.m[ranked[j].k],st0=j===0?hsh%m.length:0;for(let t=0;t<m.length&&out.length<n;t++)out.push({pi:m[(st0+t)%m.length],d:ranked[j].d});}return out;};
  const pct=(S,d)=>Math.max(1,Math.min(99,Math.round(100-S.a*d)));
  const rp=expand(K.PC,rankDist(zu,K.PC),3), ra=expand(K.ALL,rankDist(zu,K.ALL),1);
  const sm=rp.map(x=>({p:P[x.pi],m:pct(K.PC,x.d)}));
  const sa={p:P[ra[0].pi],m:pct(K.ALL,ra[0].d)};
  const md=AX.reduce((t,a)=>t+Math.abs(s[a]-50),0)/AX.length;
  const clr=mat(zu,K.PC.S).map((x,i)=>x+K.PC.mu[i]), ex6=clr.map(Math.exp), es=ex6.reduce((x,y)=>x+y,0);
  const total=Math.max(300,Math.min(720,Math.round(400+8*md)));
  const st=ex6.map(x=>Math.max(1,Math.round(total*x/es))), tot=st.reduce((x,y)=>x+y,0);
  const zt=mat(sv.map(x=>(x-50)/16),K.Wt), zn=Math.sqrt(zt.reduce((t,x)=>t+x*x,0))||1e-9;
  const pr=K.PP.v.map((v,k)=>{const c=v.reduce((t,x,i)=>t+x*zt[i],0)/zn;return {k:k,c:c,sc:c+K.PP.b[k]};}).sort((a,b)=>b.sc-a.sc);
  const pm=pr.slice(0,2).map(x=>({n:PP[x.k][0],r:PP[x.k][2],m:Math.max(1,Math.min(99,Math.round(50+50*x.c)))}));
  let rx=(hsh%2147483646)+1;for(let t=0;t<3;t++)rx=(rx*48271)%2147483647;
  const zj=mat(gc,K.Wn).map(x=>{rx=(rx*48271)%2147483647;return x+1e-7*rx/2147483647;});
  let up=1,dn=1;for(let i=2;i<=5;i++){if(zj[i]>zj[up])up=i;if(zj[i]<zj[dn])dn=i;}
  const nat=(zj[up]-zj[dn]<K.tau)?{n:NEU[up],u:0,d:0,t:'どの力にも大きな偏りがなく、場面に応じて使い分けられる。'}:{n:NAT[up+'-'+dn],u:up,d:dn,t:UPD[up]+'。'+DND[dn]+'。'};
  const rk=AX.slice().sort((x,y)=>Math.abs(s[y]-50)-Math.abs(s[x]-50));
  const p=a=>s[a]>=50?0:1;
  let ab=AB.filter(x=>x[1](s)).slice(0,2).map(x=>({n:x[0],d:x[2]}));
  const ca=AX.filter(a=>pos[a]>=4&&neg[a]>=4).sort((x,y)=>Math.min(pos[y],neg[y])-Math.min(pos[x],neg[x]));
  if(ca.length)ab.push({n:'へんげんじざい',d:'ゆらぎ：'+LB[ca[0]]+'。'+CT[ca[0]]});
  for(const a of rk){if(ab.length>=2)break;const x=AB1[a][p(a)];if(!ab.some(y=>y.n===x[0]))ab.push({n:x[0],d:x[1]});}
  const lm=new Set(MVD.LM[rp[0].pi]||[]), used=new Set(), mv=[];
  rk.slice(0,4).forEach(a=>{const k=a+(p(a)===0?'+':'-');const m=MVD.POOL[k].find(i=>lm.has(i)&&!used.has(i));if(m!==undefined){used.add(m);mv.push({n:MVD.MOVES[m],d:MVD.DESC[m],t:LB[a]+(p(a)===0?'の高さから':'の低さから')});}});
  const [t1,t2]=AX.indexOf(rk[0])<AX.indexOf(rk[1])?[rk[0],rk[1]]:[rk[1],rk[0]];
  const pair=PAIR[t1+t2][p(t1)*2+p(t2)];
  let ins=(AX.every(a=>s[a]>=40&&s[a]<=60)?BAL:INS1[rk[0]][p(rk[0])])+pair;
  if(ca.length)ins+='ただ、'+CTP[ca[0]];
  const lv=Math.max(1,Math.min(100,Math.round(md*2.4+15)));
  return {s,st,tot,sm,sa,pm,nat,ab,mv,ins,lv,_pc:rp[0].pi,_mv:mv.map(x=>x.n),_all:ra[0].pi,_pp:pr[0].k,_nat:nat.n};
}

  else h+='<div class="item"><p class="ds" style="color:var(--text-primary);">大きく迷った問いはありませんでした。判断の基準が、自分の中ではっきりしている人です。</p></div>';

  h+='<p class="note">能力値は、メインの性格に、サブの性格3つを少しずつ足して決めています（HPは寛容さ、こうげきは外向性、ぼうぎょは勤勉さ、とくこうは開放性、とくぼうは誠実さ、すばやさは繊細さがメイン）。そのため、能力値の配分は性格パラメータの配分と少し違う形になります。種族値のポケモンは、平均的な人と比べたあなたの偏りと、平均的なポケモンと比べた種族値の偏りを比べて選びます。でたらめに答えた場合に、どのポケモンもほぼ同じ確率で選ばれるよう調整しています。</p>';
  h+='<p class="note">性格パラメータは心理学のHEXACOモデルを土台にしています。問いは独自に作ったもので、検証された心理検査ではありません。このページは非公式のファン作品で、任天堂・株式会社ポケモン等とは関係ありません。種族値のデータはPokéAPIのものを使用しています。</p></div>';
  app.innerHTML=h;
  toTop();
  document.getElementById('rs').onclick=()=>{app.innerHTML=START;bindStart();toTop();};
}
bindStart();
})();
</script>
