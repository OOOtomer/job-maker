<title>ポケモン診断</title>
<style>
:root{
  --bg:#f3f5f4;--surface-1:#e9ecea;--surface-2:#ffffff;--border:rgba(0,0,0,0.12);

  --accent:#D9413A;--accent-text:#ffffff;--sub:#3B6FD4;--radius:8px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#181a1b;--surface-1:#2a2d2e;--surface-2:#212425;--border:rgba(255,255,255,0.14);
    --text-primary:#eceeee;--text-secondary:#b2b7b8;--text-muted:#858a8b;
    --accent:#E8574F;--accent-text:#ffffff;--sub:#6E98EA;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text-primary);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;line-height:1.6}
.wrap{max-width:480px;margin:0 auto;padding:16px}
.card{background:var(--surface-2);border:0.5px solid var(--border);border-radius:14px;padding:18px 18px 20px;margin-bottom:12px}
button{font-family:inherit;touch-action:manipulation;cursor:pointer}
.op{display:block;width:100%;min-height:48px;text-align:left;padding:12px 14px;margin:10px 0;font-size:15px;line-height:1.5;color:var(--text-primary);background:var(--surface-2);border:1px solid var(--border);border-radius:10px;-webkit-tap-highlight-color:transparent}
.op:active{background:var(--surface-1)}
.primary{display:block;width:100%;padding:13px;margin-top:16px;font-size:16px;font-weight:600;color:var(--accent-text);background:var(--accent);border:none;border-radius:10px}
.primary:active{opacity:.85}
.ghost{background:none;border:none;color:var(--text-secondary);font-size:13px;padding:8px 0;margin-top:4px;text-decoration:underline}
input[type=text]{width:100%;font-size:16px;padding:11px 12px;border:1px solid var(--border);border-radius:10px;background:var(--surface-2);color:var(--text-primary);font-family:inherit}
.bar{height:8px;background:var(--surface-1);border-radius:4px;overflow:hidden}
.bar>div{height:100%}
.thin{height:6px}
.sec{font-size:13px;font-weight:600;color:var(--text-secondary);margin:22px 0 8px;display:flex;align-items:center;gap:8px}
.sec::before{content:"";width:10px;height:10px;border-radius:50%;background:linear-gradient(var(--accent) 0 45%,var(--text-primary) 45% 55%,var(--surface-2) 55%);border:1px solid var(--text-primary)}
.sec.first{margin-top:0}
.row{display:grid;grid-template-columns:64px minmax(0,1fr) 28px;align-items:center;gap:8px;font-size:13px}
.cmp{display:grid;grid-template-columns:62px minmax(0,1fr) 66px;align-items:center;gap:8px;font-size:13px;margin:8px 0}
.b2{display:flex;flex-direction:column;gap:3px}
.num{text-align:right;font-variant-numeric:tabular-nums;font-size:13px;white-space:nowrap}
.item{padding:10px 0;border-top:0.5px solid var(--border)}
.nm{font-size:14px;font-weight:600;margin:0 0 2px}
.ds{font-size:13px;color:var(--text-secondary);margin:0;line-height:1.65}
.cell{background:var(--surface-1);border-radius:var(--radius);padding:10px 12px}
.type{display:inline-block;font-size:11px;padding:1px 8px;border-radius:6px;margin:0 4px 0 0;font-weight:600;line-height:1.7}
.pk{font-size:22px;font-weight:700;margin:2px 0 4px}
.no{font-size:12px;color:var(--text-muted);margin:0}
.lg{display:flex;gap:14px;font-size:12px;color:var(--text-secondary);margin:10px 0 2px}
.lg span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:var(--c)}
.note{font-size:11px;color:var(--text-muted);margin:12px 0 0;line-height:1.6}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:999px;background:var(--surface-1);color:var(--text-secondary)}
</style>
</head>
<body>
<div class="wrap" id="app">
<div class="card">
<p style="font-size:21px;font-weight:700;margin:0 0 8px;">ポケモン診断</p>
<p class="ds">24の問いに答えると、あなたの性格から「種族値」と「性格」の2つの面で、あなたに近いポケモンを見つけます。種族値は人気のポケモン134匹と、全1025匹の両方で照合します。6〜8分ほど。正解はありません。直感で選んでください。迷った時間も結果に反映されます。</p>
<label for="nm" style="display:block;font-size:13px;color:var(--text-secondary);margin:16px 0 6px;">トレーナー名（任意）</label>
<input id="nm" type="text" placeholder="たろう" autocomplete="off">
<button id="go" class="primary">冒険に出る</button>
<p class="note">回答は、このスマホの中だけで計算されます。どこにも送信・保存されません。</p>

  const c=a=>s[a]-50, f=v=>Math.round(Math.max(10,Math.min(200,v)));
  return [
    f(80+1.4*c('A')-1.0*c('E')),
    f(80+1.4*c('X')-1.0*c('A')),
    f(80+1.4*c('C')-0.8*c('O')),
    f(80+1.4*c('O')-0.8*c('X')),
    f(80+1.4*c('H')-0.8*c('E')),
    f(80-1.4*c('C')+0.8*c('X'))
  ];
}
function compute(ans){
  const sum={},ex={},va={},pos={},neg={};
  AX.forEach(a=>{sum[a]=0;ex[a]=0;va[a]=0;pos[a]=0;neg[a]=0;});
  Q.forEach((q,qi)=>{AX.forEach(a=>{
    const ws=q[2].map(o=>o[1][a]||0),m=ws.reduce((x,y)=>x+y,0)/ws.length;
    ex[a]+=m;va[a]+=ws.reduce((x,y)=>x+(y-m)*(y-m),0)/ws.length;
    const w=q[2][ans[qi]][1][a]||0;sum[a]+=w;if(w>0)pos[a]+=w;if(w<0)neg[a]-=w;});});
  const s={};
  AX.forEach(a=>{const z=va[a]>0?(sum[a]-ex[a])/Math.sqrt(va[a]):0;s[a]=Math.max(2,Math.min(99,Math.round(50+16*z)));});
  const st=calcStats(s), tot=st.reduce((x,y)=>x+y,0), pr=st.map(v=>v/tot);
  const match=list=>list.map(p=>{const b=p.slice(3,9),t=b.reduce((x,y)=>x+y,0);let d=0;for(let i=0;i<6;i++){const e=pr[i]-b[i]/t;d+=e*e;}d=Math.sqrt(d);return {p:p,d:d,m:Math.max(1,Math.min(99,Math.round(100-d*SIMK)))};}).sort((x,y)=>x.d-y.d);
  const sm=match(PC), sa=match(P);
  const u=AX.map(a=>s[a]-50), un=Math.sqrt(u.reduce((t,x)=>t+x*x,0));
  const pm=PP.map(q=>{const v=AX.map(a=>q[1][a]-50),vn=Math.sqrt(v.reduce((t,x)=>t+x*x,0));const d=Math.sqrt(AX.reduce((t,a)=>t+(s[a]-q[1][a])**2,0));const c=un<6?1-d/100:u.reduce((t,x,i)=>t+x*v[i],0)/(un*vn);return {n:q[0],r:q[2],c:c,m:Math.max(1,Math.min(99,Math.round(50+50*c)))};}).sort((x,y)=>y.c-x.c);
  const rk=AX.slice().sort((x,y)=>Math.abs(s[y]-50)-Math.abs(s[x]-50));
  const p=a=>s[a]>=50?0:1;
  let up=1,dn=1;for(let i=1;i<=5;i++){if(st[i]>st[up])up=i;if(st[i]<st[dn])dn=i;}
  const nat=(st[up]-st[dn]<12||up===dn)?{n:NEU[up],u:0,d:0,t:'どの力にも大きな偏りがなく、場面に応じて使い分けられる。'}:{n:NAT[up+'-'+dn],u:up,d:dn,t:UPD[up]+'。'+DND[dn]+'。'};
  let ab=AB.filter(x=>x[1](s)).slice(0,2).map(x=>({n:x[0],d:x[2]}));
  const ca=AX.filter(a=>pos[a]>=2&&neg[a]>=2).sort((x,y)=>Math.min(pos[y],neg[y])-Math.min(pos[x],neg[x]));
  if(ca.length)ab.push({n:'へんげんじざい',d:'ゆらぎ：'+LB[ca[0]]+'。'+CT[ca[0]]});
  for(const a of rk){if(ab.length>=2)break;const x=AB1[a][p(a)];if(!ab.some(y=>y.n===x[0]))ab.push({n:x[0],d:x[1]});}
  const mv=rk.slice(0,4).map(a=>{const x=MV[a][p(a)];return {n:x[0],d:x[1]};});
  let ins=INS[rk[0]][p(rk[0])]+INS[rk[1]][p(rk[1])];
  if(ca.length)ins+='ただ、'+CT[ca[0]];
  const md=AX.reduce((t,a)=>t+Math.abs(s[a]-50),0)/AX.length;
  const lv=Math.max(1,Math.min(100,Math.round(md*2.4+15)));
  return {s,st,tot,sm:sm.slice(0,3),sa:sa[0],pm:pm.slice(0,2),nat,ab,mv,ins,lv};
}
window.pokeDiag={compute:compute,Q:Q,P:P,PP:PP,PC:PC};

const app=document.getElementById('app');
const START=app.innerHTML;
let st={};
const esc=t=>t.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuf(a){for(let k=a.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[a[k],a[j]]=[a[j],a[k]];}return a;}
function toTop(){window.scrollTo(0,0);}
function types(t){return t.split('/').map(x=>'<span class="type" style="background:'+(TYC[x]||'#888')+';color:'+(TYDARK[x]?'#222':'#fff')+';">'+x+'</span>').join('');}
function bindStart(){document.getElementById('go').onclick=start;}
function start(){
  const v=document.getElementById('nm').value.trim();
  st={i:0,ans:new Array(Q.length).fill(-1),tm:new Array(Q.length).fill(0),ord:Q.map(q=>shuf(q[2].map((_,k)=>k))),name:v||'名もなきトレーナー',t0:0};
  showQ();
}
function showQ(){
  const q=Q[st.i],n=Q.length,pc=Math.round(st.i/n*100);
  let h='<div class="card"><div style="display:flex;justify-content:space-between;font-size:13px;color:var(--text-secondary);"><span>第'+(st.i+1)+'問 / '+n+'</span><span>'+pc+'%</span></div><div class="bar" style="margin:6px 0 16px;"><div style="width:'+pc+'%;background:var(--accent);"></div></div><p style="font-size:17px;line-height:1.7;margin:0 0 6px;">'+q[0]+'</p>';
  st.ord[st.i].forEach(k=>{h+='<button class="op" data-k="'+k+'">'+q[2][k][0]+'</button>';});
  if(st.i>0)h+='<button id="bk" class="ghost">前の問いに戻る</button>';
  h+='</div>';
  app.innerHTML=h;
  app.querySelectorAll('.op').forEach(b=>{b.onclick=()=>pick(+b.dataset.k);});
  const bk=document.getElementById('bk');if(bk)bk.onclick=back;
  toTop();
  st.t0=performance.now();
}
function pick(k){st.tm[st.i]+=performance.now()-st.t0;st.ans[st.i]=k;st.i++;if(st.i>=Q.length)result();else showQ();}
function back(){st.tm[st.i]+=performance.now()-st.t0;st.i--;showQ();}
function result(){
  const r=compute(st.ans);
  const tms=st.tm.slice().sort((x,y)=>x-y),med=tms[Math.floor(tms.length/2)];
  let hi=0;st.tm.forEach((t,k)=>{if(t>st.tm[hi])hi=k;});
  const hes=(st.tm[hi]>=1.6*med&&st.tm[hi]>5000)?hi:-1;
  const m=r.sm[0].p, mb=m.slice(3,9), mt=mb.reduce((x,y)=>x+y,0);
  const scale=Math.max(160,...r.st,...mb);
  const pk=byName[r.pm[0].n];
  let h='<div class="card"><div style="display:flex;align-items:center;gap:12px;"><div style="width:52px;height:52px;border-radius:50%;background:linear-gradient(var(--accent) 0 46%,var(--text-primary) 46% 54%,var(--surface-1) 54%);border:2px solid var(--text-primary);flex-shrink:0;position:relative;"><div style="position:absolute;left:50%;top:50%;width:16px;height:16px;margin:-8px 0 0 -8px;border-radius:50%;background:var(--surface-2);border:2px solid var(--text-primary);"></div></div><div style="flex:1;min-width:0;"><p style="font-size:18px;font-weight:700;margin:0;">'+esc(st.name)+'</p><p style="font-size:13px;color:var(--text-secondary);margin:0;">せいかく：'+r.nat.n+'</p></div><div style="text-align:right;"><p style="font-size:11px;color:var(--text-muted);margin:0;">Lv.</p><p style="font-size:26px;font-weight:700;margin:0;line-height:1;">'+r.lv+'</p></div></div>';
  h+='<p class="ds" style="margin-top:14px;color:var(--text-primary);">'+r.ins+'</p></div>';

  h+='<div class="card"><div class="sec first">種族値が一番近いポケモン</div>';
  h+='<p class="no">No.'+m[0]+(m[9]?'　<span class="pill">伝説・幻</span>':'')+'</p><p class="pk">'+m[1]+'</p><div>'+types(m[2])+'<span style="font-size:13px;color:var(--text-muted);margin-left:6px;">バランス一致度 '+r.sm[0].m+'%</span></div>';
  h+='<div class="lg"><span style="--c:var(--accent)">あなた</span><span style="--c:var(--sub)">'+m[1]+'</span></div>';
  SN.forEach((n,i)=>{h+='<div class="cmp"><span>'+n+'</span><div class="b2"><div class="bar"><div style="width:'+(r.st[i]/scale*100)+'%;background:var(--accent);"></div></div><div class="bar thin"><div style="width:'+(mb[i]/scale*100)+'%;background:var(--sub);"></div></div></div><span class="num">'+r.st[i]+' / '+mb[i]+'</span></div>';});
  h+='<div class="cmp" style="margin-top:4px;border-top:0.5px solid var(--border);padding-top:8px;"><span>合計</span><span></span><span class="num">'+r.tot+' / '+mt+'</span></div>';
  h+='<p class="ds" style="font-size:12px;margin-top:6px;">合計値ではなく、6つの能力の配分の近さで選んでいます。</p>';
  h+='<div class="cell" style="margin-top:12px;"><p class="ds" style="font-size:12px;">全1025匹の中で一番近いのは</p><p class="nm" style="margin:2px 0 0;">'+r.sa.p[1]+'<span style="font-size:12px;font-weight:400;color:var(--text-muted);margin-left:8px;">No.'+r.sa.p[0]+'　一致度 '+r.sa.m+'%</span></p></div>';
  h+='<div style="margin-top:8px;">';
  r.sm.slice(1).forEach(x=>{h+='<div class="item" style="display:flex;justify-content:space-between;gap:8px;"><span style="font-size:14px;">'+x.p[1]+'</span><span style="font-size:13px;color:var(--text-muted);">一致度 '+x.m+'%</span></div>';});
  h+='</div></div>';

  h+='<div class="card"><div class="sec first">性格が一番近いポケモン</div>';
  h+='<p class="no">No.'+pk[0]+'</p><p class="pk">'+pk[1]+'</p><div>'+types(pk[2])+'<span style="font-size:13px;color:var(--text-muted);margin-left:6px;">性格一致度 '+r.pm[0].m+'%</span></div>';
  h+='<p class="ds" style="margin-top:10px;color:var(--text-primary);">'+r.pm[0].r+'</p>';
  h+='<div class="item" style="margin-top:12px;display:flex;justify-content:space-between;gap:8px;"><span style="font-size:14px;">次点：'+r.pm[1].n+'</span><span style="font-size:13px;color:var(--text-muted);">一致度 '+r.pm[1].m+'%</span></div></div>';

  h+='<div class="card"><div class="sec first">せいかく</div><p class="nm" style="font-size:16px;">'+r.nat.n+(r.nat.u?'<span style="font-size:12px;font-weight:400;color:var(--text-muted);margin-left:8px;">'+SN[r.nat.u]+'↑　'+SN[r.nat.d]+'↓</span>':'')+'</p><p class="ds">'+r.nat.t+'</p>';
  h+='<div class="sec">とくせい</div>';
  r.ab.forEach(x=>{h+='<div class="item"><p class="nm">'+x.n+'</p><p class="ds">'+x.d+'</p></div>';});
  h+='<div class="sec">おぼえているわざ</div><div style="display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;">';
  r.mv.forEach(x=>{h+='<div class="cell"><p class="nm" style="font-size:13px;">'+x.n+'</p><p class="ds" style="font-size:12px;">'+x.d+'</p></div>';});
  h+='</div></div>';

  h+='<div class="card"><div class="sec first">性格パラメータ</div>';
  AX.forEach(a=>{const b=r.s[a]<38?0:(r.s[a]>62?2:1);h+='<div style="margin:0 0 12px;"><div class="row"><span>'+LB[a]+'</span><div class="bar"><div style="width:'+r.s[a]+'%;background:'+COL[a]+';"></div></div><span style="text-align:right;font-weight:600;">'+r.s[a]+'</span></div><p class="ds" style="font-size:12px;margin:3px 0 0 72px;">'+BAND[a][b]+'</p></div>';});
  h+='<div class="sec">迷いの在り処</div>';
  if(hes>=0)h+='<div class="item"><p class="nm">第'+(hes+1)+'問　'+Math.round(st.tm[hes]/1000)+'秒</p><p class="ds" style="margin-bottom:6px;">'+Q[hes][0]+'</p><p class="ds" style="color:var(--text-primary);">'+Q[hes][1]+'</p></div>';
  else h+='<div class="item"><p class="ds" style="color:var(--text-primary);">大きく迷った問いはありませんでした。判断の基準が、自分の中ではっきりしている人です。</p></div>';
  h+='<button id="rs" class="primary">次のトレーナーを迎える</button>';
  h+='<p class="note">性格パラメータは心理学のHEXACOモデルを土台にしています。問いは独自に作ったもので、検証された心理検査ではありません。このページは非公式のファン作品で、任天堂・株式会社ポケモン等とは関係ありません。種族値のデータはPokéAPIのものを使用しています。</p></div>';
  app.innerHTML=h;
  toTop();
  document.getElementById('rs').onclick=()=>{app.innerHTML=START;bindStart();toTop();};
}
bindStart();
})();
</script>
